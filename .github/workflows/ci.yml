name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests and coverage
        run: uv run pytest --cov=src/excel_agent --cov-report=term-missing -q

      - name: Scan for secrets
        run: uv run python scripts/scan_secrets.py

      - name: Build package
        run: uv build
