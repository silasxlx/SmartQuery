[project]
name = "excel-agent"
version = "0.2.0a1"
description = "SmartQuery 可信上传式智能问数与分析工作台"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.9",
    "chromadb>=0.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "playwright>=1.49.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "src/excel_agent/excel_loader.py",
    "src/excel_agent/graph.py",
    "src/excel_agent/join_service.py",
    "src/excel_agent/knowledge_base.py",
    "src/excel_agent/stream.py",
    "src/excel_agent/tools.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
omit = [
    "*/api.py",
    "*/excel_loader.py",
    "*/graph.py",
    "*/join_service.py",
    "*/knowledge_base.py",
    "*/stream.py",
    "*/tools.py",
    "*/main.py",
]
